[workspace]
resolver = "2"
members = [
  "core-math",
  "curve",
  "compliance",
  "bond",
  "verifier",
  "settlement",
  "redemption",
  "waterfall",
  "autopilot",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Sluice contributors"]

[workspace.dependencies]
solana-zk-token-sdk = "=1.17.34"
solana-sdk = "=1.17.34"
anchor-lang = "=0.29.0"
# `default-features = false` drops anchor-spl's `token_2022` default, which is what
# re-enables spl-token-2022's `zk-ops` default and with it solana-zk-token-sdk. The
# crates opt back in explicitly below with their own feature sets.
anchor-spl = { version = "=0.29.0", default-features = false }
# Pinned exactly. Anchor 0.29 accepts any `^1.16`, and letting it float pulls in
# 1.18, which the Solana 1.17.34 platform toolchain cannot build.
solana-program = "=1.17.34"
# spl-token-2022 1.0.0 is the release that pairs with Solana 1.17 and Anchor 0.29.
#
# Default features are switched off deliberately. The defaults are `token-group` and
# `zk-ops`, and `zk-ops` pulls in solana-zk-token-sdk, which requires solana-program
# 1.18 and so cannot build on the Solana 1.17.34 platform toolchain. Sluice needs the
# transfer hook interface, which is not behind either flag, so dropping the defaults
# costs nothing and unblocks the toolchain.
spl-token-2022 = { version = "1.0.0", default-features = false }
spl-associated-token-account = { version = "3.3.0", features = ["writable"] }
bytemuck = { version = "1.13", features = ["derive", "min_const_generics"] }
sluice-core-math = { path = "core-math" }

# Release profile.
#
# `strip` and `panic = "abort"` are both here for the same reason: they shrink the
# compiled bytecode, and on Solana bytecode size is not a vanity metric. The rent
# exempt minimum for the program data account is charged per byte, so every
# kilobyte stripped is roughly 0.005 SOL saved per programme on mainnet, or about
# 0.045 SOL across the eight.
#
# `strip = "symbols"` drops the symbol table entirely. Nothing reads it at runtime
# and it is often larger than the code it describes.
#
# `panic = "abort"` removes the unwinding tables and landing pads. Solana has no
# unwinder: a panic in a program aborts the transaction either way, so the tables
# buy nothing and cost a landing pad per function that can panic.
#
# `overflow-checks = true` stays on deliberately. This is a protocol holding user
# funds, and an arithmetic overflow must fail loudly rather than wrap a balance.
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# `panic` is deliberately absent here. Cargo rejects it in a build-override profile
# outright, and the override only ever applies to build scripts and proc macros,
# which are host artefacts rather than deployed bytecode, so there is nothing to
# gain by setting it.
[profile.release.build-override]
opt-level = "z"
size = true
incremental = false
codegen-units = 1

















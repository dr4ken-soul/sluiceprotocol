[package]
name = "sluice-curve"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "NAV anchored sixteen segment bonding curve configuration for Sluice."

[lib]
crate-type = ["cdylib", "lib"]
name = "sluice_curve"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
solana-program.workspace = true
anchor-lang.workspace = true
anchor-spl = { workspace = true, features = ["associated_token", "mint", "token"] }
sluice-core-math.workspace = true
bytemuck.workspace = true

[package]
name = "sluice-bond"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Issuer bond vault with slashing reachable only through the attestation failure path."

[lib]
crate-type = ["cdylib", "lib"]
name = "sluice_bond"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
solana-program.workspace = true
anchor-lang.workspace = true
anchor-spl = { workspace = true, features = ["associated_token", "mint", "token"] }
sluice-core-math.workspace = true
